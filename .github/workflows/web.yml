name: Web checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            controller/package-lock.json
      - run: npm ci --prefix controller && npm run check --prefix controller && npm test --prefix controller
      - run: npm ci --prefix web && npm run build --prefix web && npm test --prefix web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Provide a 48 kHz audio output for headless playback
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=prism_ci rate=48000
          pactl set-default-sink prism_ci
          test "$(pactl get-default-sink)" = prism_ci
      - run: npm run test:browser --prefix web
      - run: npm run test:playback --prefix web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-output
          path: review/web-tests/
          if-no-files-found: ignore
          retention-days: 3
